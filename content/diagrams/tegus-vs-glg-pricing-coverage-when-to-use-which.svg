  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Tegus vs GLG: where each one wins</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Tegus wins on cost and transcripts. GLG wins on reach and compliance.</text>

