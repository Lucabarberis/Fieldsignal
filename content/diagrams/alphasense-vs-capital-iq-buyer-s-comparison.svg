    <text x="348" y="442">AI SUMMARIZES DOCS</text>
    <text x="545" y="442">STRUCTURED DATA FOCUS</text>
    <text x="742" y="442">CALLS, NOT DOC SEARCH</text>
    <!-- Row 7 · primary research flexibility -->
    <text x="348" y="486">SEAT-BASED ANNUAL</text>
    <text x="545" y="486">SEAT-BASED ANNUAL</text>
    <text x="742" y="486">NO RETAINER, NO MINIMUM</text>
  </g>

