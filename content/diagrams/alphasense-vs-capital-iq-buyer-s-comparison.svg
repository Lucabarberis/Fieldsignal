<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="alphasense-vs-capital-iq-buyer-s-comparison-t alphasense-vs-capital-iq-buyer-s-comparison-d">
  <title id="alphasense-vs-capital-iq-buyer-s-comparison-t">AlphaSense vs Capital IQ Pro vs FieldSignal: who wins each buying criterion</title>
  <desc id="alphasense-vs-capital-iq-buyer-s-comparison-d">Illustrative three-column scorecard reproducing the post's own winner table across seven criteria. AlphaSense wins qualitative research content with over 10,000 sources, expert insights with 200,000+ call transcripts after the Tegus acquisition, and speed to qualitative signal. S and P Capital IQ Pro wins structured financial data, financial modeling through its Excel add-in, and price predictability through tiered or modular pricing. FieldSignal wins primary research flexibility, offering expert interviews and one-on-one calls with no annual retainer and no minimum commitment.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
