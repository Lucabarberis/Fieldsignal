  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">AlphaSense vs Capital IQ Pro</text>
  <text x="40" y="120" class="sans ink2" font-size="15">AlphaSense wins the story, Capital IQ the numbers, FieldSignal the flexibility.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Scorecard: criterion 40..250, three columns 250..447..643..840 ===== -->
  <!-- Header band -->
  <rect x="40" y="158" width="800" height="34" fill="#E8E4D5"/>
  <text x="52" y="179" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">CRITERION</text>
  <text x="348" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.06em">ALPHASENSE</text>
  <text x="545" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.06em">S&amp;P CAPITAL IQ PRO</text>
  <text x="742" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.06em">FIELDSIGNAL</text>
  <line x1="40" y1="192" x2="840" y2="192" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

