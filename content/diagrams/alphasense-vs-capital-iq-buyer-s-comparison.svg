    <line x1="735" y1="336" x2="749" y2="336"/>
    <line x1="341" y1="380" x2="355" y2="380"/>
    <line x1="735" y1="380" x2="749" y2="380"/>
    <line x1="538" y1="424" x2="552" y2="424"/>
    <line x1="735" y1="424" x2="749" y2="424"/>
    <line x1="341" y1="468" x2="355" y2="468"/>
    <line x1="538" y1="468" x2="552" y2="468"/>
