<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="healthcare-win-loss-analysis-without-six-figure-retainers-t healthcare-win-loss-analysis-without-six-figure-retainers-d">
  <title id="healthcare-win-loss-analysis-without-six-figure-retainers-t">Healthcare win-loss: pay-per-use cost vs annual retainer minimums</title>
  <desc id="healthcare-win-loss-analysis-without-six-figure-retainers-d">Illustrative chart. FieldSignal's pay-per-use cost rises with call volume, drawn as a band between $200 and $800 per call. Traditional healthcare expert networks charge a flat annual retainer or credit minimum of $25,000 to $100,000+, drawn as two dashed lines. The band reaches the retainer range only at about 125 calls per year, far above the 5 to 10 calls in a typical mid-market win-loss project.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · HEALTHCARE COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Healthcare win-loss without a retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">GLG-tier networks want $25k to $100k+ up front. FieldSignal bills per call.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Y = annual cost $0..$120k. X = calls 0..150 ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$120k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$90k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$60k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$30k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,25,50,75,100,125,150 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="226.67" y="490">25</text>
    <text x="343.33" y="490">50</text>
    <text x="460" y="490">75</text>
    <text x="576.67" y="490">100</text>
    <text x="693.33" y="490">125</text>
    <text x="810" y="490">150</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND, from published tiers.
       Lower edge $200/call: (110,470) -> 150 calls = $30,000 -> (810,394.5).
       Upper edge $800/call: (110,470) -> 150 calls = $120,000 -> (810,168).
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,168 810,394.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="394.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="420" y="360" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="420" y="374" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $800 PER CALL</text>
  <text x="460" y="308" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="683" y="440" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Retainer minimums: flat $25,000 and $100,000+ per year — thin dashed ink-2 (weight and style, not colour) -->
  <line x1="110" y1="218.33" x2="810" y2="218.33" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="255" y="211" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $100,000+</text>
  <line x1="110" y1="407.08" x2="810" y2="407.08" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="255" y="424" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $25,000</text>

  <!-- Crossovers: $100,000 / $800 = 125 calls, and $25,000 / $200 = 125 calls. One drop-line. -->
  <line x1="693.33" y1="218.33" x2="693.33" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="693.33" cy="218.33" r="4.5" fill="#161613"/>
  <circle cx="693.33" cy="407.08" r="4.5" fill="#161613"/>
  <text x="660" y="188" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">PAY-PER-USE ONLY MATCHES A</text>
  <text x="660" y="202" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">RETAINER PAST 125 CALLS A YEAR</text>

  <!-- Where mid-market win-loss projects actually sit: 5 to 10 interviews -->
  <text x="118" y="260" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">TYPICAL PROJECT — 5 TO 10 CALLS</text>
  <text x="118" y="274" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$1,000 TO $8,000 AT PUBLISHED RATES</text>
  <line x1="145" y1="284" x2="145" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">HEALTHCARE EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · rates per /pricing and cited vendor ranges</text>
</svg>
