<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="competitive-intelligence-services-without-six-figure-retainers-t competitive-intelligence-services-without-six-figure-retainers-d">
  <title id="competitive-intelligence-services-without-six-figure-retainers-t">Retainer floor vs pay-per-call: annual competitive intelligence cost</title>
  <desc id="competitive-intelligence-services-without-six-figure-retainers-d">Illustrative chart. Legacy expert networks charge a flat annual retainer starting at $30,000 before a single call. FieldSignal charges $200 to $800 per call with no retainer, so annual cost starts at zero and rises with use. That same $30,000 floor buys about 38 C-suite calls or 150 standard calls.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · RETAINER FLOOR VS PAY-PER-CALL</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Competitive intelligence without a retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Legacy retainers run $30k to $200k+ a year. Pay-per-call starts at $0.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. x = 110 + 4.66667*calls (0..150). y = 470 - 0.00755*$ (0..40k) ===== -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$40k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$30k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$20k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$10k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,30,60,90,120,150 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">30</text>
    <text x="390" y="490">60</text>
    <text x="530" y="490">90</text>
    <text x="670" y="490">120</text>
    <text x="810" y="490">150</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND: $200/call (lower) to $800/call (upper), published tiers.
       Lower $200/call: (110,470) -> (810,243.5) = $30k at 150 calls.
       Upper $800/call: (110,470) -> (343.33,168) = $40k at 50 calls, clipped along the chart top.
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 343.33,168 810,168 810,243.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="243.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="343.33" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="352" y="186" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="560" y="350" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>
  <text x="330" y="300" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="330" y="314" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $800 PER CALL, NO MINIMUM</text>

  <!-- Legacy networks: flat retainer floor, charged before any call — thin dashed ink-2 (weight/style, not colour) -->
  <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="808" y="216" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">GLG · ALPHASIGHTS · THIRD BRIDGE · GUIDEPOINT</text>
  <text x="808" y="232" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">LEGACY RETAINER FLOOR — $30k / YEAR</text>

  <!-- Break-evens against the $30k floor: $800/call at 37.5 calls, $200/call at 150 calls -->
  <circle cx="285" cy="243.5" r="4.5" fill="#161613"/>
  <circle cx="810" cy="243.5" r="4.5" fill="#161613"/>
  <line x1="285" y1="243.5" x2="285" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="297" y="432" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">THE SAME $30k BUYS 38 C-SUITE</text>
  <text x="297" y="446" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">CALLS OR 150 STANDARD CALLS</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · retainers $30k–$200k+ · call rates per /pricing</text>
</svg>
