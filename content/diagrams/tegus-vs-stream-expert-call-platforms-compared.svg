<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="tegus-vs-stream-expert-call-platforms-compared-t tegus-vs-stream-expert-call-platforms-compared-d">
  <title id="tegus-vs-stream-expert-call-platforms-compared-t">Tegus vs Stream: criterion scorecard for expert call platforms</title>
  <desc id="tegus-vs-stream-expert-call-platforms-compared-d">Illustrative scorecard comparing Tegus and Stream across seven criteria. Tegus leads on transcript library size at 200,000+ interviews, niche expert matching and published pricing from $20,000 per year. Stream leads on native AlphaSense integration and global coverage. Stream pricing is undisclosed. Neither fits a budget under $20,000.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · TEGUS VS STREAM SCORECARD</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Tegus vs Stream: where each one wins</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Tegus wins on library size and expert matching. Stream wins on integration.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Scorecard header band: y 158..192 ===== -->
  <rect x="40" y="158" width="800" height="34" fill="#E8E4D5"/>
  <text x="52" y="180" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">CRITERION</text>
  <text x="532" y="180" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.08em">TEGUS</text>
  <text x="737" y="180" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.08em">STREAM (ALPHASENSE)</text>
  <line x1="40" y1="192" x2="840" y2="192" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="430" y1="158" x2="430" y2="500" stroke="#161613" stroke-opacity="0.12"/>
  <line x1="635" y1="158" x2="635" y2="500" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row hairlines: rowH = 44 -->
  <g stroke="#161613" stroke-opacity="0.12">
    <line x1="40" y1="236" x2="840" y2="236"/>
    <line x1="40" y1="280" x2="840" y2="280"/>
    <line x1="40" y1="324" x2="840" y2="324"/>
    <line x1="40" y1="368" x2="840" y2="368"/>
    <line x1="40" y1="412" x2="840" y2="412"/>
    <line x1="40" y1="456" x2="840" y2="456"/>
    <line x1="40" y1="500" x2="840" y2="500"/>
  </g>

  <!-- Criterion labels -->
  <g class="mono ink" font-size="11" font-weight="500" letter-spacing="0.04em">
    <text x="52" y="214">TRANSCRIPT LIBRARY SIZE</text>
    <text x="52" y="258">NICHE EXPERT MATCHING</text>
    <text x="52" y="302">LIVE EXPERT CALLS</text>
    <text x="52" y="346">FILINGS AND AI IN ONE PLACE</text>
    <text x="52" y="390">GLOBAL EXPERT COVERAGE</text>
    <text x="52" y="434">PUBLISHED PRICING</text>
    <text x="52" y="478">FITS A SUB-$20k BUDGET</text>
  </g>

  <!-- ===== Row 1: transcript library size ===== -->
  <path d="M 526 203 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="532" y="221" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">200,000+ INTERVIEWS</text>
  <line x1="730" y1="203" x2="744" y2="203" stroke="#8B8980" stroke-width="1"/>
  <text x="737" y="221" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">SIZE NOT DISCLOSED</text>

  <!-- ===== Row 2: niche expert matching ===== -->
  <path d="M 526 247 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="532" y="265" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">STRONG NICHE SOURCING</text>
  <line x1="730" y1="247" x2="744" y2="247" stroke="#8B8980" stroke-width="1"/>
  <text x="737" y="265" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">EX-EXECS AND CUSTOMERS</text>

  <!-- ===== Row 3: live expert calls ===== -->
  <path d="M 526 291 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="532" y="309" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">900+ CALLS PER MONTH</text>
  <path d="M 731 291 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="737" y="309" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">CONSULTATIONS OFFERED</text>

  <!-- ===== Row 4: filings and AI in one place ===== -->
  <line x1="525" y1="335" x2="539" y2="335" stroke="#8B8980" stroke-width="1"/>
  <text x="532" y="353" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">VIA ALPHASENSE POST-DEAL</text>
  <path d="M 731 335 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="737" y="353" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">NATIVE INTEGRATION</text>

  <!-- ===== Row 5: global expert coverage ===== -->
  <line x1="525" y1="379" x2="539" y2="379" stroke="#8B8980" stroke-width="1"/>
  <text x="532" y="397" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">MOSTLY US-FOCUSED</text>
  <path d="M 731 379 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="737" y="397" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">US · EUROPE · APAC</text>

  <!-- ===== Row 6: published pricing ===== -->
  <path d="M 526 423 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <text x="532" y="441" text-anchor="middle" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">FROM $20,000 / YEAR</text>
  <line x1="730" y1="423" x2="744" y2="423" stroke="#8B8980" stroke-width="1"/>
  <text x="737" y="441" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">UNDISCLOSED / BUNDLED</text>

  <!-- ===== Row 7: fits a sub-$20k budget ===== -->
  <line x1="525" y1="467" x2="539" y2="467" stroke="#8B8980" stroke-width="1"/>
  <text x="532" y="485" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$20,000+ TO START</text>
  <line x1="730" y1="467" x2="744" y2="467" stroke="#8B8980" stroke-width="1"/>
  <text x="737" y="485" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">PRICED FOR INSTITUTIONS</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · Tegus published figures · Stream pricing undisclosed</text>
</svg>
