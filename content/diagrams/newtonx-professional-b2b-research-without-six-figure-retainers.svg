<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="newtonx-professional-b2b-research-without-six-figure-retainers-t newtonx-professional-b2b-research-without-six-figure-retainers-d">
  <title id="newtonx-professional-b2b-research-without-six-figure-retainers-t">NewtonX subscription vs. pay-per-use: annual cost by call volume</title>
  <desc id="newtonx-professional-b2b-research-without-six-figure-retainers-d">Illustrative chart. NewtonX annual subscriptions run about $30k at entry to $100k+ at scale, drawn as two flat dashed lines. FieldSignal's pay-per-use cost rises with volume, shown as a band between $200 and $800 per call. The $30k entry figure equals 150 standard calls, or 37 calls at the $800 top rate.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">NewtonX subscription vs. pay-per-use</text>
  <text x="40" y="120" class="sans ink2" font-size="15">NewtonX subscriptions start near $30k a year. FieldSignal bills per call.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810 (0..250 calls), y 168..470 ($120k..$0) =====
       scale: 2.8 px per call, 2.516667 px per $1k -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$120k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$90k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$60k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$30k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,50,100,150,200,250 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">50</text>
    <text x="390" y="490">100</text>
    <text x="530" y="490">150</text>
    <text x="670" y="490">200</text>
    <text x="810" y="490">250</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND, from published tiers.
       Upper $800/call: $120k at 150 calls -> (110,470)->(530,168), clipped at chart top.
       Lower $200/call: $50k at 250 calls -> (110,470)->(810,344.2). Flat paper-2 tint. -->
  <polygon points="110,470 530,168 810,168 810,344.2" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="344.2" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="530" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="530" y="188" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 / CALL · C-SUITE</text>
  <text x="806" y="336" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 / CALL · STANDARD</text>
  <text x="470" y="264" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="470" y="280" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER · NO MINIMUM COMMITMENT</text>

  <!-- NewtonX annual subscription bounds: $30k entry, $100k+ at scale.
       Same series, so differentiated by style only: thin dashed ink-2. -->
  <line x1="110" y1="218.3" x2="810" y2="218.3" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="118" y="213" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">NEWTONX AT SCALE — $100k+ / YEAR</text>
  <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="812" y="409" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">NEWTONX ENTRY — $30k / YEAR</text>

  <!-- Crossover: $200/call lower edge meets the $30k entry figure at 150 calls -->
  <circle cx="530" cy="394.5" r="4.5" fill="#161613"/>
  <line x1="530" y1="394.5" x2="530" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="542" y="430" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">$30k = 150 STANDARD CALLS</text>
  <text x="542" y="445" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">OR 37 CALLS AT THE $800 TOP RATE</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · NewtonX subscription range per post; rates per /pricing</text>
</svg>
