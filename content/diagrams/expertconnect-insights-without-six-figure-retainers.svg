<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="expertconnect-insights-without-six-figure-retainers-t expertconnect-insights-without-six-figure-retainers-d">
  <title id="expertconnect-insights-without-six-figure-retainers-t">Annual retainer or pay per call: annual cost by expert call volume</title>
  <desc id="expertconnect-insights-without-six-figure-retainers-d">Illustrative chart. Legacy expert network retainers start at $30,000 a year and stay flat however many calls you make. Pay-per-use cost rises with volume, between $200 and $800 per call. Even at the top $800 rate, pay-per-use stays under the $30,000 retainer floor up to about 37 calls a year. ExpertConnect also prices per call but does not publish rates.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY EXPERT CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Annual retainer, or pay per call</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Legacy networks run $30k to $200k+ a year. Pay-per-use bills by the call.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810 (0..100 calls), y 168..470 ($80k..$0) ===== -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$80k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$60k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$40k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$20k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,20,40,60,80,100 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">20</text>
    <text x="390" y="490">40</text>
    <text x="530" y="490">60</text>
    <text x="670" y="490">80</text>
    <text x="810" y="490">100</text>
  </g>

  <!-- Pay-per-use TOTAL COST BAND: $200/call lower bound to $800/call upper bound (published tiers).
       Lower $200/call: (110,470) -> 100 calls = $20,000 -> (810,394.5).
       Upper $800/call: (110,470) -> 100 calls = $80,000 -> (810,168). Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,168 810,394.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="394.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="600" y="374" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="600" y="388" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $800 PER CALL</text>
  <text x="676" y="236" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="560" y="452" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Legacy retainer floor: flat $30k/year — thin dashed ink-2 (weight and style, not colour) -->
  <line x1="110" y1="356.75" x2="810" y2="356.75" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="808" y="351" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">$30k FLOOR — SAME AT ANY VOLUME</text>

  <!-- Context block: the legacy range the post cites, and where ExpertConnect sits -->
  <text x="130" y="196" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">LEGACY RETAINERS — $30k TO $200k+ / YEAR</text>
  <text x="130" y="212" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">ONLY THE $30k FLOOR FITS THIS SCALE</text>
  <text x="130" y="232" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">EXPERTCONNECT — PER-CALL, RATES UNDISCLOSED</text>

  <!-- Crossover: $800/call meets the $30k floor at 37.5 calls -->
  <circle cx="372.5" cy="356.75" r="4.5" fill="#161613"/>
  <line x1="372.5" y1="356.75" x2="372.5" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="364" y="332" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW ~37 CALLS / YEAR,</text>
  <text x="364" y="346" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">CHEAPER EVEN AT $800 PER CALL</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · retainer range per post; call rates per /pricing</text>
</svg>
