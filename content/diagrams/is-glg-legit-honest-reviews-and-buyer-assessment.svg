<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="is-glg-legit-honest-reviews-and-buyer-assessment-t is-glg-legit-honest-reviews-and-buyer-assessment-d">
  <title id="is-glg-legit-honest-reviews-and-buyer-assessment-t">Is GLG legit? A buyer assessment across six dimensions</title>
  <desc id="is-glg-legit-honest-reviews-and-buyer-assessment-d">Illustrative assessment panel. Six rows judge GLG on operating history, network coverage, compliance posture, member reviews, pricing transparency and best-fit buyer. GLG is a real network operating since 1998 with over 1.2 million experts and more than 1,400 corporate and fund clients, and a strong compliance framework. Member reviews are mixed, pricing is opaque with commentary citing $1,000 to $2,000 per hour, and an annual commitment is required. Bottom line: real network, real work, but the wrong shape for buyers needing 5 to 20 calls.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · GLG ASSESSED BY DIMENSION</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Is GLG legit? An honest assessment</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Yes, GLG is a real network. The friction is pricing, contracts and screeners.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Assessment table: x 40..840, y 158..470 ===== -->
  <!-- Column header band -->
  <rect x="40" y="158" width="800" height="30" fill="#E8E4D5"/>
  <text x="52" y="177" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.06em">DIMENSION</text>
  <text x="316" y="177" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.06em">ASSESSMENT</text>
  <line x1="40" y1="188" x2="840" y2="188" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Column divider -->
  <line x1="300" y1="158" x2="300" y2="470" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 1 — top 188 -->
  <text x="52" y="212" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">OPERATING HISTORY</text>
  <text x="316" y="210" class="sans ink" font-size="14">Real firm since 1998. It pioneered the expert network model.</text>
  <text x="316" y="228" class="sans ink2" font-size="13">Not a scam. LinkedIn outreach is usually genuine sourcing.</text>
  <line x1="40" y1="235" x2="840" y2="235" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 2 — top 235 -->
  <text x="52" y="259" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">NETWORK COVERAGE</text>
  <text x="316" y="257" class="sans ink" font-size="14">Over 1.2 million experts, 1,400+ corporate and fund clients.</text>
  <text x="316" y="275" class="sans ink2" font-size="13">Calls run 30 to 60 minutes, with transcripts and summaries.</text>
  <line x1="40" y1="282" x2="840" y2="282" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 3 — top 282 -->
  <text x="52" y="306" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">COMPLIANCE POSTURE</text>
  <text x="316" y="304" class="sans ink" font-size="14">Strong framework. Every expert trains before client calls.</text>
  <text x="316" y="322" class="sans ink2" font-size="13">Old insider-trading cases involved GLG Partners, the fund arm.</text>
  <line x1="40" y1="329" x2="840" y2="329" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 4 — top 329 -->
  <text x="52" y="353" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">MEMBER REVIEWS</text>
  <text x="316" y="351" class="sans ink" font-size="14">Mixed. Fast payment, but unpaid screeners and no-shows.</text>
  <text x="316" y="369" class="sans ink2" font-size="13">Experience depends on which associate team you draw.</text>
  <line x1="40" y1="376" x2="840" y2="376" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 5 — top 376 -->
  <text x="52" y="400" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">PRICING TRANSPARENCY</text>
  <text x="316" y="398" class="sans ink" font-size="14">Opaque. Commentary cites $1,000 to $2,000 per hour.</text>
  <text x="316" y="416" class="sans ink2" font-size="13">Experts see their own honorarium, never the client rate.</text>
  <line x1="40" y1="423" x2="840" y2="423" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 6 — top 423 -->
  <text x="52" y="447" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">BEST-FIT BUYER</text>
  <text x="316" y="445" class="sans ink" font-size="14">Large repeat programs. Weak fit at 5 to 20 calls a year.</text>
  <text x="316" y="463" class="sans ink2" font-size="13">Annual commitment required, so light usage costs more.</text>

  <!-- Bottom line -->
  <line x1="40" y1="470" x2="840" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="52" y="490" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">BOTTOM LINE</text>
  <text x="52" y="508" class="sans ink" font-size="15">Real network, real work. Wrong shape for buyers needing 5 to 20 calls.</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · GLG rates per cited industry commentary</text>
</svg>
