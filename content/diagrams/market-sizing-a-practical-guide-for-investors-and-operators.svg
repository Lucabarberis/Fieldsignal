<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="market-sizing-a-practical-guide-for-investors-and-operators-t market-sizing-a-practical-guide-for-investors-and-operators-d">
  <title id="market-sizing-a-practical-guide-for-investors-and-operators-t">Market sizing in four steps</title>
  <desc id="market-sizing-a-practical-guide-for-investors-and-operators-d">Illustrative framework diagram. Four numbered steps run across the top: clarify the question, segment the market, choose top-down or bottom-up, and validate. Below, a bottom-up chain works the guide's Paris example: 12 million metro people times 0.4 cars per person gives 4.8 million cars, times 480 litres per car per year gives 2.3 billion litres, divided by 5 million litres per station gives about 460 stations. A sense check notes roughly 10,000 cars per station.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · FOUR-STEP MARKET SIZING METHOD</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Market sizing in four steps</text>
  <text x="40" y="120" class="sans ink2" font-size="15">A defensible range beats a precise guess. Every assumption stays visible.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Step row: 4 hairline boxes, x 40..840, y 166..300 ===== -->
  <!-- 01 CLARIFY -->
  <rect x="40" y="166" width="185" height="134" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="56" y="192" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="56" y="218" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">CLARIFY</text>
  <text x="56" y="244" class="sans ink2" font-size="12">Fix the metric and</text>
  <text x="56" y="260" class="sans ink2" font-size="12">timeframe. Name the</text>
  <text x="56" y="276" class="sans ink2" font-size="12">geography and buyer.</text>

  <!-- 02 SEGMENT -->
  <rect x="245" y="166" width="185" height="134" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="261" y="192" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.12em">02</text>
  <text x="261" y="218" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">SEGMENT</text>
  <text x="261" y="244" class="sans ink2" font-size="12">Keep segments MECE.</text>
  <text x="261" y="260" class="sans ink2" font-size="12">No overlaps, no gaps.</text>
  <text x="261" y="276" class="sans ink2" font-size="12">Two or three is enough.</text>

  <!-- 03 CHOOSE METHOD -->
  <rect x="450" y="166" width="185" height="134" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="466" y="192" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.12em">03</text>
  <text x="466" y="218" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">CHOOSE METHOD</text>
  <text x="466" y="244" class="sans ink2" font-size="12">Top-down gives a fast</text>
  <text x="466" y="260" class="sans ink2" font-size="12">ceiling. Bottom-up</text>
  <text x="466" y="276" class="sans ink2" font-size="12">gives credibility.</text>

  <!-- 04 VALIDATE -->
  <rect x="655" y="166" width="185" height="134" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="671" y="192" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.12em">04</text>
  <text x="671" y="218" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">VALIDATE</text>
  <text x="671" y="244" class="sans ink2" font-size="12">Triangulate two or</text>
  <text x="671" y="260" class="sans ink2" font-size="12">three ways. Move key</text>
  <text x="671" y="276" class="sans ink2" font-size="12">assumptions by 20%.</text>

  <!-- Divider into the worked bottom-up chain -->
  <line x1="40" y1="324" x2="840" y2="324" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="346" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">STEPS 02 TO 04 APPLIED · PARIS RETAIL FUEL STATIONS, 2026</text>

  <!-- ===== Bottom-up chain: 4 quantity boxes, y 386..446, arrows carry the operations ===== -->
  <rect x="40" y="386" width="120" height="60" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="100" y="410" text-anchor="middle" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.04em">12M</text>
  <text x="100" y="428" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">METRO PEOPLE</text>

  <rect x="267" y="386" width="120" height="60" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="327" y="410" text-anchor="middle" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.04em">4.8M</text>
  <text x="327" y="428" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">CARS</text>

  <rect x="493" y="386" width="120" height="60" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="553" y="410" text-anchor="middle" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.04em">2.3bn L</text>
  <text x="553" y="428" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">FUEL PER YEAR</text>

  <rect x="720" y="386" width="120" height="60" fill="#E8E4D5" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="780" y="410" text-anchor="middle" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.04em">≈ 460</text>
  <text x="780" y="428" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">STATIONS</text>

  <!-- Arrow 1 -->
  <line x1="172" y1="416" x2="249" y2="416" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <polygon points="255,416 249,413 249,419" fill="#161613"/>
  <text x="213" y="380" text-anchor="middle" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">× 0.4</text>
  <text x="213" y="396" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">CARS / PERSON</text>

  <!-- Arrow 2 -->
  <line x1="399" y1="416" x2="475" y2="416" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <polygon points="481,416 475,413 475,419" fill="#161613"/>
  <text x="440" y="380" text-anchor="middle" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">× 480 L</text>
  <text x="440" y="396" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">PER CAR / YEAR</text>

  <!-- Arrow 3 -->
  <line x1="625" y1="416" x2="702" y2="416" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <polygon points="708,416 702,413 702,419" fill="#161613"/>
  <text x="666" y="380" text-anchor="middle" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">÷ 5M L</text>
  <text x="666" y="396" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">PER STATION</text>

  <!-- Sense check strip -->
  <line x1="40" y1="470" x2="840" y2="470" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="492" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">SENSE CHECK · ≈10,000 CARS PER STATION</text>
  <text x="840" y="492" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">TRIANGULATE THE SAME NUMBER TWO OR THREE WAYS</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · steps and worked figures per the guide</text>
</svg>
