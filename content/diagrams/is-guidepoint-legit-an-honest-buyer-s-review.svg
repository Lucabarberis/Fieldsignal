<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="is-guidepoint-legit-an-honest-buyer-s-review-t is-guidepoint-legit-an-honest-buyer-s-review-d">
  <title id="is-guidepoint-legit-an-honest-buyer-s-review-t">Is Guidepoint legit? Buyer assessment across six dimensions</title>
  <desc id="is-guidepoint-legit-an-honest-buyer-s-review-d">Illustrative assessment table. Guidepoint scores well on legitimacy (founded 2003, 1,000+ employees, 16+ offices), expert coverage (over 1 million experts across 150+ countries, 3,250 clients, 90%+ retention) and compliance posture. It scores poorly on pricing transparency, where rates are quote-based and markup of 30 to 50 percent over advisor pay is undisclosed, and on contract terms, where enterprise accounts commonly carry annual retainers. Best fit is large firms with recurring research spend.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE &#183; BUYER ASSESSMENT BY DIMENSION</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Is Guidepoint legit? A buyer&#8217;s review</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Legitimate since 2003. The weak point is pricing clarity, not legitimacy.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Assessment table: header band y 158..188 ===== -->
  <rect x="40" y="158" width="800" height="30" fill="#E8E4D5"/>
  <text x="52" y="177" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.06em">DIMENSION</text>
  <text x="316" y="177" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.06em">ASSESSMENT</text>
  <line x1="40" y1="188" x2="840" y2="188" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Column divider -->
  <line x1="300" y1="158" x2="300" y2="470" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 1 — top 188 -->
  <text x="52" y="212" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">LEGITIMACY</text>
  <text x="316" y="210" class="sans ink" font-size="14">Verified. Founded 2003, 1,000+ employees, 16+ offices.</text>
  <text x="316" y="228" class="sans ink2" font-size="13">Not a scam. Complaints are operational, not fraud.</text>
  <line x1="40" y1="235" x2="840" y2="235" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 2 — top 235 -->
  <text x="52" y="259" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">EXPERT COVERAGE</text>
  <text x="316" y="257" class="sans ink" font-size="14">Over 1 million experts across 150+ countries.</text>
  <text x="316" y="275" class="sans ink2" font-size="13">3,250 clients and a 90%+ client retention rate.</text>
  <line x1="40" y1="282" x2="840" y2="282" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 3 — top 282 -->
  <text x="52" y="306" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">COMPLIANCE POSTURE</text>
  <text x="316" y="304" class="sans ink" font-size="14">Expert vetting, screening questions, topic restrictions.</text>
  <text x="316" y="322" class="sans ink2" font-size="13">Managed calls cut confidentiality and trading risk.</text>
  <line x1="40" y1="329" x2="840" y2="329" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 4 — top 329 : the weak point -->
  <text x="52" y="353" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">PRICING TRANSPARENCY</text>
  <text x="316" y="351" class="sans ink" font-size="14">Weakest point. No public rates, quote-based only.</text>
  <text x="316" y="369" class="sans ink2" font-size="13">Markup runs 30-50% over advisor pay and is undisclosed.</text>
  <line x1="40" y1="376" x2="840" y2="376" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 5 — top 376 -->
  <text x="52" y="400" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">CONTRACT TERMS</text>
  <text x="316" y="398" class="sans ink" font-size="14">Enterprise accounts commonly carry annual retainers.</text>
  <text x="316" y="416" class="sans ink2" font-size="13">Minimum spend rules are not published either.</text>
  <line x1="40" y1="423" x2="840" y2="423" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row 6 — top 423 -->
  <text x="52" y="447" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">BEST-FIT BUYER</text>
  <text x="316" y="445" class="sans ink" font-size="14">Large firms with recurring research spend and budget.</text>
  <text x="316" y="463" class="sans ink2" font-size="13">Poor fit for founders and lean mid-market teams.</text>

  <!-- ===== Bottom line block ===== -->
  <line x1="40" y1="470" x2="840" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="52" y="490" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">BOTTOM LINE</text>
  <text x="52" y="508" class="sans ink" font-size="15">Legitimate and capable. Priced and structured for large buyers.</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative &#183; Guidepoint pricing is quote-based and undisclosed</text>
</svg>
