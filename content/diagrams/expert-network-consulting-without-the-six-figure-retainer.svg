<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="expert-network-consulting-without-the-six-figure-retainer-t expert-network-consulting-without-the-six-figure-retainer-d">
  <title id="expert-network-consulting-without-the-six-figure-retainer-t">Transaction pricing versus a subscription minimum: annual expert-call cost by volume</title>
  <desc id="expert-network-consulting-without-the-six-figure-retainer-d">Illustrative line chart. A subscription or retainer network charges a flat annual minimum of roughly $100k whatever the usage, drawn as a thin dashed line. FieldSignal's transaction pricing starts at zero and rises with each call, drawn as a band between the $200 standard rate and the $800 C-suite rate. At the top rate the band reaches the $100k minimum at 125 calls a year. The post also cites market rates of $300 to $1,200 per expert hour.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Transaction pricing vs. subscription</text>
  <text x="40" y="120" class="sans ink2" font-size="15">A $100k+ annual minimum is flat. FieldSignal calls cost $200 to $800.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470.
       X = expert calls per year, 0..250 -> 2.8 px per call.
       Y = annual cost, $0..$200k -> 302 px / 200000 = 0.00151 px per dollar. ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$200k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$150k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$100k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$50k</text>
    <text x="102" y="473" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,50,100,150,200,250 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">50</text>
    <text x="390" y="490">100</text>
    <text x="530" y="490">150</text>
    <text x="670" y="490">200</text>
    <text x="810" y="490">250</text>
  </g>

  <!-- FieldSignal transaction pricing BAND, from published per-call tiers.
       Upper edge $800/call: 250 calls = $200k -> (810,168), exactly the axis maximum.
       Lower edge $200/call: 250 calls = $50k  -> (810,394.5).
       Both edges start at the origin, so the band is a clean wedge. Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,168 810,394.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="168" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="394.5" stroke="#161613" stroke-width="1.25"/>
  <text x="560" y="296" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="530" y="352" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY PER CALL</text>
  <text x="530" y="366" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER · NO MINIMUM · NO CREDITS</text>
  <text x="520" y="446" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Subscription or retainer network: flat $100k+ annual minimum.
       Thin dashed ink-2 — differentiated by weight and style, never by colour. -->
  <line x1="110" y1="319" x2="810" y2="319" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="118" y="312" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">SUBSCRIPTION — $100k+ ANNUAL MINIMUM</text>
  <text x="118" y="336" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">FLAT — PAID WHETHER YOU USE IT OR NOT</text>

  <!-- Market context stated in the post: $300 to $1,200 per expert hour -->
  <text x="118" y="196" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">MARKET RATE PER EXPERT HOUR — $300 TO $1,200</text>

  <!-- Crossover: $800 x 125 calls = $100k -> x = 110 + 125 * 2.8 = 460, y = 319 -->
  <circle cx="460" cy="319" r="4.5" fill="#161613"/>
  <line x1="460" y1="319" x2="460" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="452" y="274" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">125 CALLS TO MATCH THE MINIMUM</text>
  <text x="452" y="288" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">AT THE TOP $800 RATE</text>
  <text x="460" y="490" text-anchor="middle" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">125</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · rates per /pricing · subscription minimums quote-based</text>
</svg>
