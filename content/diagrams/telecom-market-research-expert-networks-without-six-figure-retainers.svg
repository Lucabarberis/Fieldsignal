<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="telecom-market-research-expert-networks-without-six-figure-retainers-t telecom-market-research-expert-networks-without-six-figure-retainers-d">
  <title id="telecom-market-research-expert-networks-without-six-figure-retainers-t">Telecom expert research: pay-per-use versus an annual retainer</title>
  <desc id="telecom-market-research-expert-networks-without-six-figure-retainers-d">Illustrative chart of annual cost against telecom expert calls per year. Major expert networks require a $50k to $200k+ annual commitment before the first call, drawn as a flat dashed line at the $50k floor. FieldSignal's pay-per-use cost rises with volume inside a band from $200 to $800 per call. The top rate reaches the $50k floor at about 62 calls a year, so below that volume pay-per-use costs less.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY TELECOM CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Telecom research: pay-per-use vs. retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Major networks require $50k to $200k+ a year. FieldSignal bills per call.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470 =====
       X: 0..125 calls  -> 5.6 px per call
       Y: $0..$100,000  -> 0.00302 px per dollar (302px / 100k) -->

  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$100k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$75k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$50k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$25k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,25,50,75,100,125 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">25</text>
    <text x="390" y="490">50</text>
    <text x="530" y="490">75</text>
    <text x="670" y="490">100</text>
    <text x="810" y="490">125</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND, from published tiers.
       Lower edge $200/call: 125 calls = $25,000 -> (810, 394.5)
       Upper edge $800/call: 125 calls = $100,000 -> (810, 168)
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,168 810,394.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="394.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="600" y="286" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="520" y="356" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="520" y="370" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $800 PER CALL, NO MINIMUM</text>
  <text x="806" y="430" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Retainer networks: flat $50k floor of the stated $50k-$200k+ annual range.
       Thin dashed ink-2 — differentiated by weight and style, not colour. -->
  <text x="120" y="296" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">MAJOR NETWORKS — GLG, ALPHASIGHTS, THIRD BRIDGE</text>
  <text x="120" y="310" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER FLOOR — $50k TO $200k+ PER YEAR</text>
  <line x1="110" y1="319" x2="810" y2="319" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="120" y="336" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">AVERAGE CALL THERE: ~$1,300 WITH FEES</text>

  <!-- Crossover: the $800 top rate reaches the $50k floor at 62.5 calls -> x = 110 + 62.5*5.6 = 460 -->
  <line x1="460" y1="262" x2="460" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="460" cy="319" r="4.5" fill="#161613"/>
  <text x="452" y="240" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW ~62 CALLS / YEAR,</text>
  <text x="452" y="254" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">CHEAPER EVEN AT TOP RATES</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">TELECOM EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · retainer range per post sources · rates per /pricing</text>
</svg>
