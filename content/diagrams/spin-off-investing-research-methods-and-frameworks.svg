<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="spin-off-investing-research-methods-and-frameworks-t spin-off-investing-research-methods-and-frameworks-d">
  <title id="spin-off-investing-research-methods-and-frameworks-t">A six-step spin-off research process</title>
  <desc id="spin-off-investing-research-methods-and-frameworks-d">Illustrative framework diagram. Six hairline boxes in a two-row grid set out the article's spin-off research process: classify the deal, map incentives and the transaction perimeter, segment sellers and buyers, build a standalone model, run primary research, then track execution. The primary research box is shaded because that step builds the differentiated view. The output is a one-page thesis with key risks and catalysts.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · SIX-STEP SPIN-OFF RESEARCH PROCESS</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">A six-step spin-off research process</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Run this in the first 30 to 90 days, while the mispricing window is open.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Step grid: 3 columns (x 40 / 316 / 592, w 248), 2 rows (y 162 / 332, h 146) ===== -->

  <!-- 01 CLASSIFY THE DEAL -->
  <rect x="40" y="162" width="248" height="146" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="56" y="192" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">01</text>
  <line x1="40" y1="208" x2="288" y2="208" stroke="#161613" stroke-opacity="0.12"/>
  <text x="56" y="234" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">CLASSIFY THE DEAL</text>
  <g class="sans ink2" font-size="12">
    <text x="56" y="256">Growth asset freed, cyclical</text>
    <text x="56" y="272">carve-out or regulatory split.</text>
    <text x="56" y="288">Read the Form 10 rationale.</text>
  </g>

  <!-- arrow 01 -> 02 -->
  <line x1="294" y1="235" x2="304" y2="235" stroke="#161613" stroke-width="1"/>
  <polygon points="304,231.5 311,235 304,238.5" fill="#161613"/>

  <!-- 02 INCENTIVES &amp; PERIMETER -->
  <rect x="316" y="162" width="248" height="146" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="332" y="192" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">02</text>
  <line x1="316" y1="208" x2="564" y2="208" stroke="#161613" stroke-opacity="0.12"/>
  <text x="332" y="234" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">INCENTIVES &amp; PERIMETER</text>
  <g class="sans ink2" font-size="12">
    <text x="332" y="256">Map debt, pensions and equity</text>
    <text x="332" y="272">grants. Check what IP stayed</text>
    <text x="332" y="288">with the parent.</text>
  </g>

  <!-- arrow 02 -> 03 -->
  <line x1="570" y1="235" x2="580" y2="235" stroke="#161613" stroke-width="1"/>
  <polygon points="580,231.5 587,235 580,238.5" fill="#161613"/>

  <!-- 03 SELLERS &amp; BUYERS -->
  <rect x="592" y="162" width="248" height="146" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="608" y="192" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">03</text>
  <line x1="592" y1="208" x2="840" y2="208" stroke="#161613" stroke-opacity="0.12"/>
  <text x="608" y="234" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">SELLERS &amp; BUYERS</text>
  <g class="sans ink2" font-size="12">
    <text x="608" y="256">Classify parent holders by</text>
    <text x="608" y="272">mandate. Index dates create</text>
    <text x="608" y="288">predictable passive flows.</text>
  </g>

  <!-- 04 STANDALONE MODEL -->
  <rect x="40" y="332" width="248" height="146" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="56" y="362" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">04</text>
  <line x1="40" y1="378" x2="288" y2="378" stroke="#161613" stroke-opacity="0.12"/>
  <text x="56" y="404" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">STANDALONE MODEL</text>
  <g class="sans ink2" font-size="12">
    <text x="56" y="426">Strip corporate allocations.</text>
    <text x="56" y="442">Rebuild 3 to 5 years. Model</text>
    <text x="56" y="458">base, re-rate and downside.</text>
  </g>

  <!-- arrow 04 -> 05 -->
  <line x1="294" y1="405" x2="304" y2="405" stroke="#161613" stroke-width="1"/>
  <polygon points="304,401.5 311,405 304,408.5" fill="#161613"/>

  <!-- 05 PRIMARY RESEARCH — shaded: the step that builds the edge -->
  <rect x="316" y="332" width="248" height="146" fill="#E8E4D5" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="332" y="362" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">05</text>
  <line x1="316" y1="378" x2="564" y2="378" stroke="#161613" stroke-opacity="0.12"/>
  <text x="332" y="404" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">PRIMARY RESEARCH</text>
  <g class="sans ink2" font-size="12">
    <text x="332" y="426">4 to 6 expert calls. 8 to 15</text>
    <text x="332" y="442">customer calls. A 30 to 50</text>
    <text x="332" y="458">respondent survey.</text>
  </g>

  <!-- arrow 05 -> 06 -->
  <line x1="570" y1="405" x2="580" y2="405" stroke="#161613" stroke-width="1"/>
  <polygon points="580,401.5 587,405 580,408.5" fill="#161613"/>

  <!-- 06 TRACK EXECUTION -->
  <rect x="592" y="332" width="248" height="146" fill="none" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <text x="608" y="362" class="mono ink" font-size="13" font-weight="600" letter-spacing="0.10em">06</text>
  <line x1="592" y1="378" x2="840" y2="378" stroke="#161613" stroke-opacity="0.12"/>
  <text x="608" y="404" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">TRACK EXECUTION</text>
  <g class="sans ink2" font-size="12">
    <text x="608" y="426">Watch four quarters against</text>
    <text x="608" y="442">plan. Book follow-up calls</text>
    <text x="608" y="458">6 to 9 months after the spin.</text>
  </g>

  <!-- Grid notes -->
  <text x="40" y="504" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">OUTPUT · ONE-PAGE THESIS, KEY RISKS AND CATALYSTS</text>
  <text x="840" y="504" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">SHADED · STEP THAT BUILDS THE EDGE</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · steps and counts as stated in the article</text>
</svg>
