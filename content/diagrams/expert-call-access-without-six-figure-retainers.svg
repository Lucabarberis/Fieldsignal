<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="expert-call-access-without-six-figure-retainers-t expert-call-access-without-six-figure-retainers-d">
  <title id="expert-call-access-without-six-figure-retainers-t">Pay-per-call versus a six-figure retainer minimum: annual cost by call volume</title>
  <desc id="expert-call-access-without-six-figure-retainers-d">Illustrative line chart. A retainer network commits roughly $100k a year before the first call, drawn as a flat dashed line. FieldSignal's pay-per-call cost starts at zero and rises with usage, shown as a band between $200 and $800 per call. At the top C-suite rate the band meets the $100k minimum at 125 calls a year; at the $200 standard rate it takes 500 calls.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST AT LOW CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Pay-per-call vs. a six-figure minimum</text>
  <text x="40" y="120" class="sans ink2" font-size="15">A retainer charges $100k+ before call one. Pay-per-call starts at zero.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Y = annual cost $0..$150k. X = calls 0..200 (3.5 px/call) ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$150k</text>
    <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="271.7" text-anchor="end">$100k</text>
    <line x1="110" y1="369.3" x2="810" y2="369.3" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="372.3" text-anchor="end">$50k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,50,100,150,200 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="285" y="490">50</text>
    <text x="460" y="490">100</text>
    <text x="635" y="490">150</text>
    <text x="810" y="490">200</text>
  </g>

  <!-- FieldSignal pay-per-call TOTAL COST BAND from published tiers.
       Lower edge $200/call: (110,470) -> 200 calls = $40k -> (810,389.5).
       Upper edge $800/call: (110,470) -> $150k at 187.5 calls -> (766.25,168), then clipped along the ceiling.
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 766.25,168 810,168 810,389.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="389.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="766.25" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="600" y="302" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-CALL</text>
  <text x="600" y="316" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER · NO MINIMUM</text>
  <text x="806" y="424" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>
  <text x="545" y="192" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>

  <!-- Retainer network: flat $100k+ annual minimum — thin dashed ink-2 (weight and style, not colour) -->
  <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="804" y="262" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $100k+ MINIMUM</text>
  <text x="118" y="288" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">$100k+ COMMITTED AT ZERO CALLS</text>

  <!-- Crossover: $800/call reaches $100k at 125 calls -> x = 110 + 125*3.5 = 547.5 -->
  <circle cx="547.5" cy="268.7" r="4.5" fill="#161613"/>
  <line x1="547.5" y1="268.7" x2="547.5" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="539" y="382" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">125 CALLS AT $800 MATCHES</text>
  <text x="539" y="396" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">A $100k RETAINER MINIMUM</text>
  <text x="539" y="410" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">AT $200 A CALL IT TAKES 500</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · rates per /pricing · retainer minimums undisclosed</text>
</svg>
