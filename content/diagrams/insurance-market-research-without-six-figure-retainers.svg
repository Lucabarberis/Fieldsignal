<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="insurance-market-research-without-six-figure-retainers-t insurance-market-research-without-six-figure-retainers-d">
  <title id="insurance-market-research-without-six-figure-retainers-t">Insurance research cost: pay-per-use band vs. a flat six-figure retainer</title>
  <desc id="insurance-market-research-without-six-figure-retainers-d">Illustrative line chart. FieldSignal's pay-per-use cost for insurance expert calls rises with usage, drawn as a band between $200 per standard call and $800 per C-suite call. A traditional expert network retainer stays flat at a $100k+ annual minimum. The $800 upper bound meets the retainer at 125 calls per year, so below that volume pay-per-use costs less.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · INSURANCE RESEARCH COST BY VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Insurance research without a retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Pay-per-use runs $200 to $800 per call. A $100k+ retainer stays flat.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Scale: $200k over 302px = 1.51px/$1k; 200 calls over 700px = 3.5px/call ===== -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$200k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$150k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$100k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$50k</text>
    <text x="102" y="473" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,40,80,120,160,200 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">40</text>
    <text x="390" y="490">80</text>
    <text x="530" y="490">120</text>
    <text x="670" y="490">160</text>
    <text x="810" y="490">200</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND, from published tiers.
       Lower edge $200/call: (110,470) -> 200 calls = $40k -> (810,409.6).
       Upper edge $800/call: (110,470) -> 200 calls = $160k -> (810,228.4).
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,228.4 810,409.6" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="409.6" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="228.4" stroke="#161613" stroke-width="1.25"/>

  <!-- Retainer network: flat $100k annual minimum — thin dashed ink-2 (weight/style, not colour) -->
  <line x1="110" y1="319" x2="810" y2="319" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="118" y="336" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $100k+ MINIMUM</text>

  <!-- Series labels -->
  <text x="560" y="350" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="560" y="364" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $800 PER CALL</text>
  <text x="806" y="216" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="806" y="436" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Crossover: $800/call reaches $100k at 125 calls -> x = 110 + 125*3.5 = 547.5 -->
  <circle cx="547.5" cy="319" r="4.5" fill="#161613"/>
  <line x1="547.5" y1="319" x2="547.5" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="538" y="254" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW 125 CALLS / YEAR,</text>
  <text x="538" y="268" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">EVEN THE $800 C-SUITE RATE</text>
  <text x="538" y="282" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">COSTS LESS THAN A RETAINER</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">INSURANCE EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · FieldSignal rates per /pricing · retainers quote-based</text>
</svg>
