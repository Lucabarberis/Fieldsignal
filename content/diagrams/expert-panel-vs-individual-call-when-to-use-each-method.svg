<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="expert-panel-vs-individual-call-when-to-use-each-method-t expert-panel-vs-individual-call-when-to-use-each-method-d">
  <title id="expert-panel-vs-individual-call-when-to-use-each-method-t">Expert panel vs individual call: scorecard across seven criteria</title>
  <desc id="expert-panel-vs-individual-call-when-to-use-each-method-d">Illustrative scorecard comparing a moderated expert panel of 3 to 5 experts against a one-on-one expert call. The panel scores on breadth of perspectives, on consensus validation because peers can challenge a claim in real time, and on cost per insight when breadth is the goal. The individual call scores on depth, because one expert holds the full session, on sensitive intelligence, because experts self-censor in front of peers, on speed, since panels need 2 to 3 weeks of calendar coordination while single calls book in days, and on cost per session, since a panel pays 3 to 5 honoraria plus a moderator. Panels frame the themes, single calls probe the tension.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · PANEL VS INDIVIDUAL CALL SCORECARD</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Expert panel vs. individual call</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Breadth versus depth. Panels win consensus, single calls win candid detail.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Scorecard header band ===== -->
  <rect x="40" y="158" width="800" height="34" fill="#E8E4D5"/>
  <text x="52" y="179" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">CRITERION</text>
  <text x="532" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.1em">EXPERT PANEL</text>
  <text x="737" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.1em">INDIVIDUAL CALL</text>
  <line x1="40" y1="192" x2="840" y2="192" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Column separators -->
  <line x1="430" y1="158" x2="430" y2="486" stroke="#161613" stroke-opacity="0.12"/>
  <line x1="635" y1="158" x2="635" y2="486" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Criterion labels -->
  <g class="mono ink" font-size="11" font-weight="500" letter-spacing="0.06em">
    <text x="52" y="214">BREADTH OF PERSPECTIVES</text>
    <text x="52" y="256">DEPTH ON A SINGLE TOPIC</text>
    <text x="52" y="298">CONSENSUS VALIDATION</text>
    <text x="52" y="340">SENSITIVE INTELLIGENCE</text>
    <text x="52" y="382">SPEED TO FIRST CALL</text>
    <text x="52" y="424">COST PER SESSION</text>
    <text x="52" y="466">COST PER INSIGHT AT BREADTH</text>
  </g>

  <!-- Verdict phrases -->
  <g class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="532" y="220">3-5 EXPERTS AT ONCE</text>
    <text x="737" y="220">ONE VIEW PER CALL</text>
    <text x="532" y="262">AIRTIME IS SHARED</text>
    <text x="737" y="262">FULL SESSION, ONE EXPERT</text>
    <text x="532" y="304">PEERS CHALLENGE CLAIMS</text>
    <text x="737" y="304">NO PEER CHECK</text>
    <text x="532" y="346">EXPERTS SELF-CENSOR</text>
    <text x="737" y="346">PRIVATE AND CANDID</text>
    <text x="532" y="388">2-3 WEEK LEAD TIME</text>
    <text x="737" y="388">DAYS, NOT WEEKS</text>
    <text x="532" y="430">3-5 FEES PLUS MODERATOR</text>
    <text x="737" y="430">ONE HONORARIUM</text>
    <text x="532" y="472">OFTEN LOWER</text>
    <text x="737" y="472">HIGHER PER INSIGHT</text>
  </g>

  <!-- Strong marks: heavy ink check -->
  <g fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square">
    <path d="M 526 202 l 4.5 5 l 8 -11"/>
    <path d="M 731 244 l 4.5 5 l 8 -11"/>
    <path d="M 526 286 l 4.5 5 l 8 -11"/>
    <path d="M 731 328 l 4.5 5 l 8 -11"/>
    <path d="M 731 370 l 4.5 5 l 8 -11"/>
    <path d="M 731 412 l 4.5 5 l 8 -11"/>
    <path d="M 526 454 l 4.5 5 l 8 -11"/>
  </g>

  <!-- Weak / absent marks: thin ink-3 dash -->
  <g stroke="#8B8980" stroke-width="1">
    <line x1="730" y1="202" x2="744" y2="202"/>
    <line x1="525" y1="244" x2="539" y2="244"/>
    <line x1="730" y1="286" x2="744" y2="286"/>
    <line x1="525" y1="328" x2="539" y2="328"/>
    <line x1="525" y1="370" x2="539" y2="370"/>
    <line x1="525" y1="412" x2="539" y2="412"/>
    <line x1="730" y1="454" x2="744" y2="454"/>
  </g>

  <!-- Row hairlines -->
  <g stroke="#161613" stroke-opacity="0.12">
    <line x1="40" y1="234" x2="840" y2="234"/>
    <line x1="40" y1="276" x2="840" y2="276"/>
    <line x1="40" y1="318" x2="840" y2="318"/>
    <line x1="40" y1="360" x2="840" y2="360"/>
    <line x1="40" y1="402" x2="840" y2="402"/>
    <line x1="40" y1="444" x2="840" y2="444"/>
    <line x1="40" y1="486" x2="840" y2="486"/>
  </g>

  <!-- Who wins for whom -->
  <text x="440" y="506" text-anchor="middle" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.06em">PANELS FRAME THE THEMES · SINGLE CALLS PROBE THE TENSION</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · verdicts per this post's comparison tables</text>
</svg>
