<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="insurance-due-diligence-expert-insights-without-six-figure-retainers-t insurance-due-diligence-expert-insights-without-six-figure-retainers-d">
  <title id="insurance-due-diligence-expert-insights-without-six-figure-retainers-t">Insurance diligence expert cost versus a six-figure retainer</title>
  <desc id="insurance-due-diligence-expert-insights-without-six-figure-retainers-d">Illustrative chart. FieldSignal pay-per-use expert hours are shown as a band between $200 and $600 per hour, rising with use. A six-figure retainer stays flat at a $100k annual minimum. At the top $600 rate the two meet near 165 hours a year.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY EXPERT HOURS</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Insurance diligence without a retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Expert calls run $200 to $600 an hour. A six-figure retainer is flat.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Y: $0=470, $150k=168 (0.0020133 px per $).
       X: 0..200 hours at 3.5 px per hour. ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$150k</text>
    <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="272" text-anchor="end">$100k</text>
    <line x1="110" y1="369.3" x2="810" y2="369.3" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="372" text-anchor="end">$50k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,40,80,120,160,200 expert call hours) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">40</text>
    <text x="390" y="490">80</text>
    <text x="530" y="490">120</text>
    <text x="670" y="490">160</text>
    <text x="810" y="490">200</text>
  </g>

  <!-- FieldSignal pay-per-use BAND: the post's stated $200-$600 per hour range.
       Lower $200/hr: 200 h = $40k -> (810,389.5). Upper $600/hr: 200 h = $120k -> (810,228.4).
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,228.4 810,389.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="389.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="228.4" stroke="#161613" stroke-width="1.25"/>
  <text x="500" y="372" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="500" y="386" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 TO $600 PER HOUR</text>
  <text x="806" y="216" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$600 / HOUR · SPECIALIST</text>
  <text x="685" y="436" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 / HOUR · STANDARD</text>

  <!-- Retainer network: flat $100k minimum — thin dashed ink-2 (weight and style, not colour) -->
  <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="668" y="249" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">LARGE NETWORKS · RATES UNDISCLOSED</text>
  <text x="668" y="263" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $100k+ ANNUAL MINIMUM</text>

  <!-- Crossover: $100,000 / $600 per hour = 166.7 hours -> x = 110 + 166.7*3.5 = 693.3 -->
  <circle cx="693.3" cy="268.7" r="4.5" fill="#161613"/>
  <line x1="693.3" y1="268.7" x2="693.3" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="540" y="296" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW ~165 HOURS / YEAR,</text>
  <text x="540" y="310" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">CHEAPER EVEN AT $600 / HOUR</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALL HOURS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · $200-$600 hourly range per post · six-figure retainer minimums</text>
</svg>
