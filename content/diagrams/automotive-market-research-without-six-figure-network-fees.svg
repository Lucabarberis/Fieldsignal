<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="automotive-market-research-without-six-figure-network-fees-t automotive-market-research-without-six-figure-network-fees-d">
  <title id="automotive-market-research-without-six-figure-network-fees-t">Automotive research cost: pay-per-call band vs network subscription range</title>
  <desc id="automotive-market-research-without-six-figure-network-fees-d">Illustrative line chart. FieldSignal pay-per-call cost rises with volume, between $200 per standard call and $800 per C-suite call. Reported expert network subscriptions run $30,000 to $200,000+ a year and stay flat regardless of use. At standard rates 150 calls a year match the $30k low end; 250 calls at the $800 rate match the $200k top end.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL RESEARCH COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Automotive research without six-figure fees</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Automotive calls cost $200 to $800. Reported subscriptions run $30k to $200k+.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Scale: $0 = y470, $240k = y168 (1.258333 px per $1k) ===== -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$240k</text>
    <line x1="110" y1="243.5" x2="810" y2="243.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="246.5" text-anchor="end">$180k</text>
    <line x1="110" y1="319" x2="810" y2="319" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="322" text-anchor="end">$120k</text>
    <line x1="110" y1="394.5" x2="810" y2="394.5" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="397.5" text-anchor="end">$60k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks: 0..300 calls, 2.333333 px per call -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="226.67" y="490">50</text>
    <text x="343.33" y="490">100</text>
    <text x="460" y="490">150</text>
    <text x="576.67" y="490">200</text>
    <text x="693.33" y="490">250</text>
    <text x="810" y="490">300</text>
  </g>

  <!-- FieldSignal pay-per-call TOTAL COST BAND, from published tiers.
       Lower edge $200/call: (110,470) -> 300 calls = $60k -> (810,394.5)
       Upper edge $800/call: (110,470) -> 300 calls = $240k -> (810,168)
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,168 810,394.5" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="394.5" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="810" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="490" y="330" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-CALL</text>
  <text x="490" y="346" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER, NO MINIMUM</text>
  <text x="640" y="260" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE RATE</text>
  <text x="700" y="398" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD RATE</text>

  <!-- Reported network subscription range: flat $30k (low end) to $200k+ (top end).
       Thin dashed ink-2 — differentiated by weight and style, not colour. -->
  <line x1="110" y1="218.333" x2="810" y2="218.333" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="118" y="212" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">$200k+ TOP END</text>
  <line x1="110" y1="432.25" x2="810" y2="432.25" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="806" y="428" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">$30k LOW END</text>
  <text x="118" y="250" class="mono ink2" font-size="11" font-weight="600" letter-spacing="0.04em">RETAINER NETWORKS — FLAT ANNUAL FEE</text>
  <text x="118" y="264" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">REPORTED $30k TO $200k+ PER YEAR</text>

  <!-- Break-even A: $30,000 / $200 = 150 calls -->
  <circle cx="460" cy="432.25" r="4.5" fill="#161613"/>
  <line x1="460" y1="432.25" x2="460" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="470" y="449" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BREAK-EVEN: 150 STANDARD CALLS</text>
  <text x="470" y="463" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">MATCH THE $30k LOW END</text>

  <!-- Break-even B: $200,000 / $800 = 250 calls -->
  <circle cx="693.33" cy="218.333" r="4.5" fill="#161613"/>
  <text x="676" y="206" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">250 CALLS AT $800 = $200k TOP END</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · rates per /pricing; ranges per sources cited in post</text>
</svg>
