<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="expert-call-transcripts-without-annual-retainers-t expert-call-transcripts-without-annual-retainers-d">
  <title id="expert-call-transcripts-without-annual-retainers-t">Pay per transcript versus an annual retainer: annual cost by call volume</title>
  <desc id="expert-call-transcripts-without-annual-retainers-d">Illustrative chart. FieldSignal bills $200 to $800 per expert call with the transcript included, so annual cost rises with volume, drawn as a band between the two rates. A network retainer stays flat at a six-figure minimum, drawn here at $100k as a dashed line. The band meets that minimum at 125 calls a year at the $800 C-suite rate and at 500 calls a year at the $200 standard rate.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL COST BY TRANSCRIPT VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Pay per transcript vs. annual retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Pay per call at $200 to $800. Network retainers start in six figures.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Y = annual cost $0..$150k (2.0133 px per $1k).
       X = expert calls per year 0..600 (1.16667 px per call). ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$150k</text>
    <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="271.7" text-anchor="end">$100k</text>
    <line x1="110" y1="369.3" x2="810" y2="369.3" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="372.3" text-anchor="end">$50k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,100,200,300,400,500,600 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="226.7" y="490">100</text>
    <text x="343.3" y="490">200</text>
    <text x="460" y="490">300</text>
    <text x="576.7" y="490">400</text>
    <text x="693.3" y="490">500</text>
    <text x="810" y="490">600</text>
  </g>

  <!-- FieldSignal per-transcript TOTAL COST BAND from published tiers.
       Lower edge $200/call: (110,470) -> 600 calls = $120k -> (810,228.4).
       Upper edge $800/call: (110,470) -> $150k at 187.5 calls -> (328.75,168), then clipped along the ceiling.
       Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 810,228.4 810,168 328.75,168" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="228.4" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="328.75" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="470" y="224" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PER TRANSCRIPT</text>
  <text x="470" y="238" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER · NO MINIMUM</text>
  <text x="330" y="184" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 · C-SUITE CALL</text>
  <text x="400" y="400" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$200 · STANDARD CALL</text>

  <!-- Retainer network: flat six-figure annual minimum, drawn at $100k — thin dashed ink-2 (weight and style, not colour) -->
  <line x1="110" y1="268.7" x2="810" y2="268.7" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="120" y="234" class="mono ink2" font-size="11" font-weight="600" letter-spacing="0.04em">NETWORK RETAINER</text>
  <text x="120" y="248" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$100k+ MINIMUM</text>
  <text x="120" y="262" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">RATES UNDISCLOSED</text>

  <!-- Crossover A: $800/call reaches $100k at 125 calls -> x = 110 + 125*1.16667 = 255.8 -->
  <circle cx="255.8" cy="268.7" r="4.5" fill="#161613"/>
  <line x1="255.8" y1="268.7" x2="255.8" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="264" y="436" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">125 CALLS AT $800</text>
  <text x="264" y="450" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">MATCH A $100k RETAINER</text>

  <!-- Crossover B: $200/call reaches $100k at 500 calls -> x = 110 + 500*1.16667 = 693.3 -->
  <circle cx="693.3" cy="268.7" r="4.5" fill="#161613"/>
  <line x1="693.3" y1="268.7" x2="693.3" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="681" y="436" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">500 CALLS AT $200</text>
  <text x="681" y="450" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">MATCH THE SAME MINIMUM</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · rates per /pricing · retainer minimums undisclosed</text>
</svg>
