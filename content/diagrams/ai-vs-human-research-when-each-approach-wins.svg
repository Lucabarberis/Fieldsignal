  <g stroke="#8B8980" stroke-width="1">
    <line x1="730" y1="202" x2="744" y2="202"/>
    <line x1="730" y1="244" x2="744" y2="244"/>
    <line x1="525" y1="286" x2="539" y2="286"/>
    <line x1="525" y1="328" x2="539" y2="328"/>
