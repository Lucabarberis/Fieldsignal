<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="get-primary-latam-market-research-intelligence-without-six-figure-retainers-t get-primary-latam-market-research-intelligence-without-six-figure-retainers-d">
  <title id="get-primary-latam-market-research-intelligence-without-six-figure-retainers-t">LATAM expert calls vs. annual retainer: annual cost by call volume</title>
  <desc id="get-primary-latam-market-research-intelligence-without-six-figure-retainers-d">Illustrative band chart. Pay-per-use LATAM expert interviews run $300 to $800 per call, so annual cost rises with volume as a band. A tier-1 network's retainer stays flat at an $80,000 annual minimum. The band's $800 upper edge meets the retainer at 100 calls per year; below that, pay-per-use costs less even at top rates.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · LATAM ANNUAL COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">LATAM expert calls vs. annual retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">LATAM honoraria run $300 to $800 per call. A tier-1 retainer starts at $80,000.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810 (0..250 calls), y 168..470 ($0..$120k) ===== -->
  <!-- Horizontal gridlines + Y ticks -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$120k</text>
    <line x1="110" y1="268.67" x2="810" y2="268.67" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="271.67" text-anchor="end">$80k</text>
    <line x1="110" y1="369.33" x2="810" y2="369.33" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="372.33" text-anchor="end">$40k</text>
    <text x="102" y="473" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,50,100,150,200,250 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="250" y="490">50</text>
    <text x="390" y="490">100</text>
    <text x="530" y="490">150</text>
    <text x="670" y="490">200</text>
    <text x="810" y="490">250</text>
  </g>

  <!-- FieldSignal pay-per-use TOTAL COST BAND: $300/call (lower) to $800/call (upper), the LATAM honoraria
       range stated in the post. Lower $300/call: (110,470)->(810,281.25 = $75k @250 calls).
       Upper $800/call: (110,470)->(530,168 = $120k @150 calls), clipped along the chart top to the right
       edge. Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 530,168 810,168 810,281.25" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="281.25" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="530" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="470" y="294" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY-PER-USE</text>
  <text x="470" y="310" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$300 TO $800 PER CALL</text>
  <text x="476" y="194" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$800 PER CALL</text>
  <text x="700" y="344" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$300 PER CALL</text>

  <!-- Tier-1 retainer: flat $80,000 annual minimum — thin dashed ink-2 (weight/style, not colour) -->
  <line x1="110" y1="268.67" x2="810" y2="268.67" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="800" y="263" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">RETAINER — $80,000+ MINIMUM</text>

  <!-- Crossover of the $800 upper edge with the retainer floor, at 100 calls -->
  <circle cx="390" cy="268.67" r="4.5" fill="#161613"/>
  <line x1="390" y1="268.67" x2="390" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="380" y="238" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW 100 CALLS / YEAR,</text>
  <text x="380" y="252" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">CHEAPER EVEN AT $800 / CALL</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · LATAM honoraria and tier-1 annual minimums</text>
</svg>
