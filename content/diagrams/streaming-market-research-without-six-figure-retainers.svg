<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="streaming-market-research-without-six-figure-retainers-t streaming-market-research-without-six-figure-retainers-d">
  <title id="streaming-market-research-without-six-figure-retainers-t">Streaming research without a retainer: annual cost by call volume</title>
  <desc id="streaming-market-research-without-six-figure-retainers-d">Illustrative line chart. A legacy expert network subscription stays flat at its $30,000 annual minimum regardless of usage, while pay-per-interview cost rises with each call, between $300 and $1,500 per call. Even at the $1,500 top rate, 20 calls a year only match the $30,000 minimum.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · ANNUAL RESEARCH COST BY CALL VOLUME</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">Streaming research without a retainer</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Legacy networks charge $30k to $200k+ a year. You can pay per call instead.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Plot area: x 110..810, y 168..470. Y = annual cost, $0..$45k (6.7111 px per $1k). X = calls, 0..40 (17.5 px per call) ===== -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">
    <line x1="110" y1="168" x2="810" y2="168" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="171" text-anchor="end">$45k</text>
    <line x1="110" y1="268.67" x2="810" y2="268.67" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="272" text-anchor="end">$30k</text>
    <line x1="110" y1="369.33" x2="810" y2="369.33" stroke="#161613" stroke-opacity="0.12"/>
    <text x="102" y="373" text-anchor="end">$15k</text>
    <text x="102" y="474" text-anchor="end">$0</text>
  </g>

  <!-- Axes -->
  <line x1="110" y1="168" x2="110" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>
  <line x1="110" y1="470" x2="810" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- X ticks (0,10,20,30,40 calls) -->
  <g class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <text x="110" y="490">0</text>
    <text x="285" y="490">10</text>
    <text x="460" y="490">20</text>
    <text x="635" y="490">30</text>
    <text x="810" y="490">40</text>
  </g>

  <!-- Pay-per-interview TOTAL COST BAND: $300/call (lower) to $1,500/call (upper), the range the post states.
       Lower $300/call: (110,470) -> (810,389.47 = $12k @40 calls). Upper $1,500/call: (110,470) -> (635,168 = $45k @30 calls),
       clipped along the chart top to the right edge. Flat paper-2 tint, no gradient. -->
  <polygon points="110,470 635,168 810,168 810,389.47" fill="#E8E4D5"/>
  <line x1="110" y1="470" x2="810" y2="389.47" stroke="#161613" stroke-width="1.25"/>
  <line x1="110" y1="470" x2="635" y2="168" stroke="#161613" stroke-width="1.25"/>
  <text x="800" y="192" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$1,500 PER CALL · TOP END</text>
  <text x="800" y="428" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">$300 PER CALL · LOW END</text>
  <text x="520" y="330" class="mono ink" font-size="11" font-weight="600" letter-spacing="0.04em">FIELDSIGNAL — PAY PER INTERVIEW</text>
  <text x="520" y="346" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">TYPICAL RANGE $300 TO $1,500</text>
  <text x="520" y="362" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">NO RETAINER · NO MINIMUM</text>

  <!-- Legacy network: flat $30k annual floor — thin dashed ink-2 (differentiated by weight/style, not colour) -->
  <line x1="110" y1="268.67" x2="810" y2="268.67" stroke="#5A5852" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="800" y="262" text-anchor="end" class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em">LEGACY RETAINER — $30k MINIMUM</text>

  <!-- Crossover of the $1,500 top rate with the $30k floor, at 20 calls -->
  <circle cx="460" cy="268.67" r="4.5" fill="#161613"/>
  <line x1="460" y1="268.67" x2="460" y2="470" stroke="#161613" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="452" y="224" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BREAK-EVEN — 20 CALLS AT $1,500</text>
  <text x="452" y="240" text-anchor="end" class="mono ink" font-size="10" font-weight="600" letter-spacing="0.06em">BELOW THAT, PAY-PER-USE COSTS LESS</text>

  <!-- X axis title -->
  <text x="460" y="514" text-anchor="middle" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.12em">EXPERT CALLS PER YEAR</text>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · per-call rates and published network minimums</text>
</svg>
