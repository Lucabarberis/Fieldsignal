<svg class="fs-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="alphasense-vs-bloomberg-cost-coverage-use-cases-t alphasense-vs-bloomberg-cost-coverage-use-cases-d">
  <title id="alphasense-vs-bloomberg-cost-coverage-use-cases-t">AlphaSense vs Bloomberg: seven-criterion scorecard</title>
  <desc id="alphasense-vs-bloomberg-cost-coverage-use-cases-d">Illustrative two-column scorecard. Bloomberg takes real-time market data, structured financial data and published price at about $31,980 per user annually. AlphaSense takes qualitative document research across 10,000+ sources, 260,000+ expert call transcripts and an easier learning curve, but prices only by custom quote. Neither sells without an annual commitment.</desc>
  <style>
    .fs-diagram .sans { font-family: var(--font-sans, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif); }
    .fs-diagram .mono { font-family: var(--font-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace); }
    .fs-diagram .ink { fill: var(--color-ink, #161613); } .fs-diagram .ink2 { fill: var(--color-ink-2, #5A5852); } .fs-diagram .ink3 { fill: var(--color-ink-3, #8B8980); }
    .fs-diagram .red { fill: var(--color-red, #D8312A); } .fs-diagram .blue { fill: var(--color-brand, #0080FF); }
  </style>

  <!-- Canvas: paper (never white) -->
  <rect x="0" y="0" width="880" height="560" fill="#F2EFE6"/>

  <!-- Masthead index + title -->
  <text x="40" y="52" class="mono red" font-size="11" font-weight="600" letter-spacing="0.12em">01</text>
  <text x="66" y="52" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">/ ILLUSTRATIVE · PLATFORM SCORECARD BY CRITERION</text>
  <text x="40" y="92" class="sans ink" font-size="30" font-weight="500" letter-spacing="-0.022em">AlphaSense vs Bloomberg</text>
  <text x="40" y="120" class="sans ink2" font-size="15">Bloomberg wins live markets. AlphaSense wins document research.</text>

  <!-- Hairline rule under header -->
  <line x1="40" y1="138" x2="840" y2="138" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ===== Scorecard header band ===== -->
  <rect x="40" y="158" width="800" height="34" fill="#E8E4D5"/>
  <text x="52" y="179" class="mono ink3" font-size="11" font-weight="500" letter-spacing="0.12em">CRITERION</text>
  <text x="532" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.04em">ALPHASENSE</text>
  <text x="737" y="179" text-anchor="middle" class="mono ink" font-size="12" font-weight="600" letter-spacing="0.04em">BLOOMBERG</text>
  <line x1="40" y1="192" x2="840" y2="192" stroke="#161613" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="430" y1="158" x2="430" y2="500" stroke="#161613" stroke-opacity="0.12"/>
  <line x1="635" y1="158" x2="635" y2="500" stroke="#161613" stroke-opacity="0.12"/>

  <!-- Row rules -->
  <g stroke="#161613" stroke-opacity="0.12">
    <line x1="40" y1="236" x2="840" y2="236"/>
    <line x1="40" y1="280" x2="840" y2="280"/>
    <line x1="40" y1="324" x2="840" y2="324"/>
    <line x1="40" y1="368" x2="840" y2="368"/>
    <line x1="40" y1="412" x2="840" y2="412"/>
    <line x1="40" y1="456" x2="840" y2="456"/>
    <line x1="40" y1="500" x2="840" y2="500"/>
  </g>

  <!-- Criterion labels -->
  <g class="mono ink" font-size="11" font-weight="500" letter-spacing="0.04em">
    <text x="52" y="214">REAL-TIME MARKET DATA</text>
    <text x="52" y="258">STRUCTURED FINANCIAL DATA</text>
    <text x="52" y="302">QUALITATIVE DOCUMENT RESEARCH</text>
    <text x="52" y="346">EXPERT CALL TRANSCRIPTS</text>
    <text x="52" y="390">PUBLISHED PRICE</text>
    <text x="52" y="434">LEARNING CURVE</text>
    <text x="52" y="478">NO ANNUAL RETAINER</text>
  </g>

  <!-- Verdict phrases -->
  <g class="mono ink2" font-size="10" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
    <!-- AlphaSense column -->
    <text x="532" y="220">LIMITED</text>
    <text x="532" y="264">MODERATE</text>
    <text x="532" y="308">10,000+ SOURCES</text>
    <text x="532" y="352">260,000+ TRANSCRIPTS</text>
    <text x="532" y="396">CUSTOM QUOTE ONLY</text>
    <text x="532" y="440">NATURAL LANGUAGE</text>
    <text x="532" y="484">USUALLY NO</text>
    <!-- Bloomberg column -->
    <text x="737" y="220">INDUSTRY STANDARD</text>
    <text x="737" y="264">VERY STRONG</text>
    <text x="737" y="308">NEWS + ANALYST NOTES</text>
    <text x="737" y="352">LIMITED</text>
    <text x="737" y="396">~$31,980 / USER / YEAR</text>
    <text x="737" y="440">COMMAND-HEAVY</text>
    <text x="737" y="484">NO</text>
  </g>

  <!-- Verdict marks: heavy ink check = strong, thin dash = weak or partial -->
  <!-- Row 1 — real-time market data -->
  <line x1="525" y1="202" x2="539" y2="202" stroke="#8B8980" stroke-width="1"/>
  <path d="M 731 202 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <!-- Row 2 — structured financial data -->
  <line x1="525" y1="246" x2="539" y2="246" stroke="#8B8980" stroke-width="1"/>
  <path d="M 731 246 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <!-- Row 3 — qualitative document research -->
  <path d="M 526 290 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <line x1="730" y1="290" x2="744" y2="290" stroke="#8B8980" stroke-width="1"/>
  <!-- Row 4 — expert call transcripts -->
  <path d="M 526 334 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <line x1="730" y1="334" x2="744" y2="334" stroke="#8B8980" stroke-width="1"/>
  <!-- Row 5 — published price -->
  <line x1="525" y1="378" x2="539" y2="378" stroke="#8B8980" stroke-width="1"/>
  <path d="M 731 378 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <!-- Row 6 — learning curve -->
  <path d="M 526 422 l 4.5 5 l 8 -11" fill="none" stroke="#161613" stroke-width="2.2" stroke-linecap="square"/>
  <line x1="730" y1="422" x2="744" y2="422" stroke="#8B8980" stroke-width="1"/>
  <!-- Row 7 — no annual retainer: neither -->
  <line x1="525" y1="466" x2="539" y2="466" stroke="#8B8980" stroke-width="1"/>
  <line x1="730" y1="466" x2="744" y2="466" stroke="#8B8980" stroke-width="1"/>

  <!-- Footer: hairline + wordmark (blue = identity only) + source note -->
  <line x1="40" y1="534" x2="840" y2="534" stroke="#161613" stroke-opacity="0.12"/>
  <text x="40" y="552" class="sans blue" font-size="15" font-weight="900" letter-spacing="0.02em">FIELDSIGNAL</text>
  <text x="840" y="552" text-anchor="end" class="mono ink3" font-size="10" font-weight="500" letter-spacing="0.06em">Illustrative · Bloomberg price per public benchmark · AlphaSense undisclosed</text>
</svg>
