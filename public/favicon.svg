<?xml version="1.0" encoding="UTF-8"?>
<!--
  FieldSignal · Favicon
  100×100 square. Blue background with white "FS" monogram.
  Use: Browser tab, app icon, small-size applications where the full wordmark
       loses legibility (below 60px digital, 12mm print).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="FieldSignal">
  <title>FieldSignal</title>
  <rect width="100" height="100" fill="#0080FF"/>
  <text x="50" y="50"
        font-family="'Inter', 'Helvetica Neue', 'Arial Black', sans-serif"
        font-weight="900"
        font-size="62"
        fill="#F2EFE6"
        text-anchor="middle"
        dominant-baseline="central"
        text-rendering="geometricPrecision">FS</text>
</svg>
